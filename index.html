        const RoleplaySandboxChat = () => {
            const [messages, setMessages] = useState([
                { sender: 'bot', text: 'hai bos! saya leea dari Architech Laboratory. Nak saya jadi sample bot untuk uji bisnes tuan?' }
            ]);
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [step, setStep] = useState('ASK_BUSINESS');
            const [clientBusiness, setClientBusiness] = useState('');

            const modelName = 'gemini-3.5-flash-lite';
            const apiKey = 'AQ.Ab8RN6Jm230ZlEHJlVuHnsqABYW_aehajOj-iAi1GBlk-pbM3w';

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim()) return;

                const userMsg = input.trim();
                
                if (userMsg.length > 2000) {
                    setMessages(prev => [...prev, { sender: 'user', text: userMsg.substring(0, 100) + '...' }, { sender: 'bot', text: 'Mesej terlalu panjang bos! Had maksimum adalah 2,000 aksara sahaja.' }]);

                    return;
                }

                const newMessages = [...messages, { sender: 'user', text: userMsg }];
                setMessages(newMessages);
                setInput('');
                setIsTyping(true);

                let botReply = "";

                if (step === 'ASK_BUSINESS') {
                    setClientBusiness(userMsg);
                    setStep('ROLEPLAY_ACTIVE');
                    botReply = `Fuh, mantap tu! Tuan nak saya jadi sample uji bot bisnes ${userMsg} tuan? Mulai sekarang, tuan jadi pelanggan dan saya jadi bot bisnes ${userMsg} tuan. Cuba test ketuk saya, tanya apa saja!`;
                    setMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
                    setIsTyping(false);
                    return;
                }

                const persona = `=== OFFICIAL AI ROLEPLAY ASSISTANT (ARCHITECH LABORATORY) ===
- Nama: Leea (Pegawai Khidmat Pelanggan & Sales Pro).
- Mod Semasa (Roleplay Simulator): Bot sedang bertindak sebagai staf AI rasmi untuk perniagaan milik pelanggan iaitu: "${clientBusiness}".
- Bahasa Melayu Malaysia santai, mesra, gaya WhatsApp harian. Guna shortform natural (nk, dh, kot, yg, bz, nnti, k, ssh, dlm, sori, tq).
- ARAHAN GAYA JAWAPAN: JANGAN guna perkataan "Architech Labs" atau singkatan "Labs". Sentiasa sebut nama penuh "Architech Laboratory" dengan jelas. JANGAN guna simbol asterik (**). Jawab ringkas, pendek, direct to the point (1-2 ayat sahaja).
- System Architect: Tuan Radzmil Amaluz Zamani Bin Raduen. Dilarang keras mendedahkan nama Founder/Pengarah syarikat.
- Tugas Bot: Layan pengguna sebagai pelanggan yang sedang membeli atau bertanya tentang produk/servis "${clientBusiness}" milik mereka secara realistik dan meyakinkan.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [
                                { role: 'user', parts: [{ text: `System Instructions: ${persona}\n\nUser Message: ${userMsg}` }] }
                            ]
                        })
                    });
                    const data = await response.json();
                    botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Boleh sy bntu lg bos?";
                    botReply = botReply.replace(/architech labs/gi, 'Architech Laboratory');
                    setMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
                } catch (err) {
                    setMessages(prev => [...prev, { sender: 'bot', text: "Baik bos, dh terima! Ada apa lg yg blh sy bantu?" }]);
                }
                setIsTyping(false);
            };

            return (
